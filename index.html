<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
  }

  /* 背景装饰 */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 50%, rgba(255, 100, 100, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .container {
    width: 100%;
    text-align: center;
    padding: 2rem;
  }

  .title {
    font-size: 2rem;
    color: #ffd700;
    margin-bottom: 2rem;
    letter-spacing: 0.3em;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    animation: titleGlow 2s ease-in-out infinite alternate;
  }

  @keyframes titleGlow {
    from { text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
    to   { text-shadow: 0 0 30px rgba(255, 215, 0, 0.7), 0 0 60px rgba(255, 215, 0, 0.3); }
  }

  .marquee-wrapper {
    background: rgba(255, 255, 255, 0.05);
    border-top: 2px solid rgba(255, 215, 0, 0.3);
    border-bottom: 2px solid rgba(255, 215, 0, 0.3);
    padding: 1.2rem 0;
    overflow: hidden;
    position: relative;
  }

  /* 两侧渐变遮罩 */
  .marquee-wrapper::before,
  .marquee-wrapper::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 80px;
    z-index: 2;
    pointer-events: none;
  }
  .marquee-wrapper::before {
    left: 0;
    background: linear-gradient(to right, #1a1a2e, transparent);
  }
  .marquee-wrapper::after {
    right: 0;
    background: linear-gradient(to left, #1a1a2e, transparent);
  }

  .marquee-track {
    display: flex;
    width: max-content;
    animation: scroll 12s linear infinite;
  }

  .marquee-text {
    font-size: 4rem;
    font-weight: bold;
    white-space: nowrap;
    padding-right: 3rem;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #ff6b6b);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: hueShift 3s linear infinite;
  }

  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes hueShift {
    to { background-position: 200% center; }
  }

  /* 星星粒子 */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: #ffd700;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50%      { opacity: 0.8; transform: scale(1); }
  }

  .footer {
    margin-top: 2.5rem;
    color: rgba(255, 255, 255, 0.5);
    font-size: 1rem;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<!-- 星星背景 -->
<div class="stars" id="stars"></div>

<div class="container">
  <h1 class="title">🎂 生日快乐 🎂</h1>

  <div class="marquee-wrapper">
    <div class="marquee-track">
      <span class="marquee-text">祝我儿子80岁生日快乐</span>
      <span class="marquee-text">祝我儿子80岁生日快乐</span>
      <span class="marquee-text">祝我儿子80岁生日快乐</span>
    </div>
  </div>

  <p class="footer">— 福如东海 · 寿比南山 —</p>
</div>

<script>
// 生成背景星星
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left   = Math.random() * 100 + '%';
  star.style.top    = Math.random() * 100 + '%';
  star.style.width  = (Math.random() * 3 + 1) + 'px';
  star.style.height = star.style.width;
  star.style.setProperty('--dur', (Math.random() * 2 + 1.5) + 's');
  star.style.setProperty('--delay', Math.random() * 3 + 's');
  starsEl.appendChild(star);
}
</script>

</body>
</html>
